const io = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target.querySelector('video');
  if (v) e.isIntersecting ? v.play().catch(() => {}) : v.pause();
}), { rootMargin: '200px' });
let current = null;
function build(def) {
  io.disconnect();
  grid.innerHTML = '';
  document.body.classList.toggle('mobile', def === MOBILE);
  frame.style.width = def.w + 'px';
  frame.style.height = def.h + 'px';
  grid.style.cssText = `left:${def.gx}px;top:${def.gy}px;width:${def.w + 2}px;height:${def.h - def.gy}px`;

    const t = document.createElement('div');
    t.className = 't';
    t.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    if (ref.endsWith('.mp4')) {
      const v = document.createElement('video');
      v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
      v.poster = ref.replace('.mp4', '-poster.jpg');
      const webm = document.createElement('source');
      webm.src = ref.replace('.mp4', '.webm');
      webm.type = 'video/webm';
      v.appendChild(webm);
      const mp4 = document.createElement('source');
      mp4.src = ref;
      mp4.type = 'video/mp4';
      v.appendChild(mp4);
      t.appendChild(v);
      io.observe(t);
    } else {
      const img = document.createElement('img');
      img.src = ref; img.loading = 'lazy'; img.alt = '';
      t.appendChild(img);
    }
    grid.appendChild(t);
  }
  current = def;
}

  const def = mq.matches ? MOBILE : DESKTOP;

  document.body.style.height = (def.h * s) + 'px';
}
